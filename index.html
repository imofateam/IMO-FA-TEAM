        function createProfileAvatarWithSiteName(siteName) {
            const cleanName = (siteName && siteName.trim()) ? siteName.trim() : 'تیم فارسی زبانان';
            const escaped = cleanName.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            const fontSize = escaped.length > 14 ? 26 : (escaped.length > 9 ? 32 : 38);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><linearGradient id="profGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#0284c7"/></linearGradient></defs><rect width="400" height="400" fill="url(#profGrad)"/><circle cx="200" cy="200" r="178" fill="none" stroke="#fbbf24" stroke-width="6" stroke-dasharray="14 8" opacity="0.9"/><circle cx="200" cy="200" r="158" fill="rgba(9,16,33,0.78)" stroke="#38bdf8" stroke-width="3"/><text x="200" y="132" text-anchor="middle" fill="#fbbf24" font-family="Vazirmatn, sans-serif" font-size="21" font-weight="800">پروفایل رسمی</text><text x="200" y="212" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn, sans-serif" font-size="${fontSize}" font-weight="900">${escaped}</text><text x="200" y="272" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="22" font-weight="800">🇮🇷 FA TEAM 🇦🇫</text></svg>`;
            return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
        }

        function formatCountryDateAndDay(now, tz) {
            const wk = new Intl.DateTimeFormat('fa-IR', { weekday: 'short', timeZone: tz }).format(now);
            const dt = new Intl.DateTimeFormat('fa-IR', { month: 'short', day: 'numeric', timeZone: tz }).format(now);
            return `${wk} · ${dt}`;
        }

        function updateDateAndClocks() {
            const now = new Date();
            document.getElementById('liveWeekday').innerText = new Intl.DateTimeFormat('fa-IR', { weekday: 'long', timeZone: 'Asia/Kabul' }).format(now);
            document.getElementById('livePersianDate').innerText = new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Kabul' }).format(now);
            document.getElementById('liveGregorianDate').innerText = new Intl.DateTimeFormat('en-US', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'Asia/Kabul' }).format(now);

            document.getElementById('clockAfghanistan').innerText = new Intl.DateTimeFormat('fa-IR', { timeZone: 'Asia/Kabul', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(now);
            document.getElementById('clockIran').innerText = new Intl.DateTimeFormat('fa-IR', { timeZone: 'Asia/Tehran', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(now);
            document.getElementById('clockTurkey').innerText = new Intl.DateTimeFormat('fa-IR', { timeZone: 'Europe/Istanbul', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(now);

            document.getElementById('dateCountryAfg').innerText = formatCountryDateAndDay(now, 'Asia/Kabul');
            document.getElementById('dateCountryIran').innerText = formatCountryDateAndDay(now, 'Asia/Tehran');
            document.getElementById('dateCountryTurkey').innerText = formatCountryDateAndDay(now, 'Europe/Istanbul');
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function openSectionModal(sectionKey) {
            const modal = document.getElementById('sectionDetailsModal');
            const titleEl = document.getElementById('sectionModalTitle');
            const subEl = document.getElementById('sectionModalSubtitle');
            const bodyEl = document.getElementById('sectionModalBody');
            bodyEl.innerHTML = '';

            if (sectionKey === 'svip') {
                titleEl.innerText = 'افیشل های تیم فارسی زبان';
                subEl.innerText = 'مدیران و اسویپ‌های رسمی بخش فارسی';
                bodyEl.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">' + appData.svip.map(item => `
                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-sky-400/35 flex flex-col gap-3">
                        <div><h4 class="font-bold text-white text-sm">${escapeHtml(item.name)}</h4><span class="text-xs text-sky-300 font-mono">ایدی اکانت: ${escapeHtml(item.accountId)}</span></div>
                        <button onclick="copyToClipboard('${escapeHtml(item.accountId)}')" class="w-full py-2 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 text-sky-200 text-xs font-bold">کپی آیدی اکانت</button>
                    </div>
                `).join('') + '</div>';
            } else if (sectionKey === 'assistants') {
                titleEl.innerText = 'دستیاران تیم فارسی زبان';
                subEl.innerText = 'ارتباط با اکانت، کال گروه ایمو و گروه دستیاران';
                bodyEl.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">' + appData.assistants.map(ast => `
                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-emerald-400/35 flex flex-col gap-3">
                        <h4 class="font-black text-white text-base">${escapeHtml(ast.name)}</h4>
                        <div class="flex gap-1.5">
                            <a href="${escapeHtml(ast.profile)}" target="_blank" class="flex-1 py-2 rounded-xl bg-slate-800 text-center text-xs text-emerald-200 font-bold">اکانت دستیار</a>
                            <a href="${escapeHtml(ast.callGroup)}" target="_blank" class="flex-1 py-2 rounded-xl bg-blue-600 text-center text-xs text-white font-bold">کال گروه ایمو</a>
                            <a href="${escapeHtml(ast.group)}" target="_blank" class="flex-1 py-2 rounded-xl bg-emerald-600 text-center text-xs text-white font-bold">گروه دستیار</a>
                        </div>
                    </div>
                `).join('') + '</div>';
            } else if (sectionKey === 'merchants') {
                titleEl.innerText = 'مرچنت های بخش فارسی زبان';
                subEl.innerText = 'فروشندگان رسمی و معتبر الماس';
                bodyEl.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">' + appData.merchants.map(mer => `
                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-purple-400/35 flex flex-col gap-3">
                        <div><h4 class="font-bold text-white text-sm">${escapeHtml(mer.name)}</h4><span class="text-xs text-purple-300 font-mono">ایدی اکانت: ${escapeHtml(mer.accountId)}</span></div>
                        <div class="flex gap-2">
                            <a href="${escapeHtml(mer.link)}" target="_blank" class="flex-1 py-2 rounded-xl bg-purple-600 text-white text-center text-xs font-bold">لینک اکانت</a>
                            <button onclick="copyToClipboard('${escapeHtml(mer.accountId)}')" class="px-3 py-2 rounded-xl bg-slate-800 text-purple-200 text-xs font-bold">کپی آیدی</button>
                        </div>
                    </div>
                `).join('') + '</div>';
            } else if (sectionKey === 'rules') {
                titleEl.innerText = 'قوانین فروشنده گی و شرایط فروشنده رسمی شدن';
                subEl.innerText = 'معلومات کامل برای متقاضیان فروشندگی الماس';
                bodyEl.innerHTML = '<ul class="space-y-2.5">' + appData.merchantRules.map(r => `
                    <li class="flex items-center gap-2.5 bg-slate-900/90 border border-amber-400/25 p-3 rounded-xl text-sm text-white"><i class="fa-solid fa-circle-check text-amber-400"></i><span>${escapeHtml(r)}</span></li>
                `).join('') + `</ul><div class="p-4 rounded-2xl bg-amber-500/15 border border-amber-400/40 text-xs sm:text-sm text-amber-100 leading-relaxed"><strong class="text-amber-300 block mb-1">یاداشت:</strong>${escapeHtml(appData.merchantNote)}</div>`;
            } else if (sectionKey === 'security') {
                titleEl.innerText = 'هشدار امنیتی و تشخیص مدال‌های رسمی';
                subEl.innerText = 'پشت اکانت و مدال‌های رسمی را حتماً چک کنید';
                bodyEl.innerHTML = `<div class="bg-rose-950/60 border border-rose-500/40 rounded-2xl p-4 space-y-2.5 text-xs"><p class="font-bold text-amber-300">⚠️ هشدار: کسانیکه از اسم افیشل و دستیار های تیم سوءاستفاده می‌کنند بیشتر شده‌اند، متوجه باشید!</p><ul class="space-y-1.5 text-slate-100"><li>❌ افیشل تیم برای هیچ کسی مدال ارسال نمی‌کند.</li><li>❌ افیشل های تیم برای هیچ کسی الماس ارسال نمی‌کند.</li><li>❌ افیشل های تیم نیاز به اکانت های شما ندارد.</li><li>❌ افیشل های تیم از هیچ کسی تقاضای پول و اکانت نمی‌کند.</li></ul></div>`;
            } else if (sectionKey === 'channels') {
                titleEl.innerText = 'کانال اف ای و گروه‌های دستیار های تیم';
                subEl.innerText = 'برای عضویت روی هر لینک کلیک کنید';
                bodyEl.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">' + appData.channels.map(chan => `
                    <a href="${escapeHtml(chan.url)}" target="_blank" class="p-4 rounded-2xl bg-slate-900/90 border border-cyan-400/30 hover:border-cyan-400 flex items-center justify-between transition"><span class="font-bold text-white text-xs sm:text-sm">${escapeHtml(chan.title)}</span><i class="fa-solid fa-arrow-up-left-from-square text-cyan-400"></i></a>
                `).join('') + '</div>';
            }
            modal.classList.remove('hidden');
        }

        function closeSectionModal() {
            document.getElementById('sectionDetailsModal').classList.add('hidden');
        }

        function copyToClipboard(text) {
            navigator.clipboard?.writeText(text);
            alert('آیدی کپی شد: ' + text);
        }

        document.getElementById('mainProfileAvatar').src = createProfileAvatarWithSiteName(appData.settings.siteTitle);
        updateDateAndClocks();
        setInterval(updateDateAndClocks, 1000);
    </script>
</body>
</html>
